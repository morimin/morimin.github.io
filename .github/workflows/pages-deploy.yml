# Notion → GitHub 자동 업로드
# 노션 DB에서 '배포' 체크된 글을 _posts/ 로 가져와 커밋합니다.
# 커밋이 push되면 GitHub Pages(브랜치 배포)가 자동으로 사이트를 빌드·배포합니다.
name: "Import from Notion"

on:
  # 매일 오전 6시, 오후 5시(KST) 자동 실행
  # (오후 4시에 Claude가 노션에 쓴 글을 같은 날 오후 5시에 공개)
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 8 * * *"
  # GitHub Actions 탭의 'Run workflow' 버튼으로 수동 실행
  workflow_dispatch:
  # 기존 외부 호출(노션 버튼 등) 방식도 그대로 유지
  repository_dispatch:
    types: [RUN_WORKFLOW_DISPATCH]

permissions:
  contents: write

# 동시에 두 번 돌지 않도록
concurrency:
  group: "notion-import"
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: node _scripts/notion-import.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          commit_message: "[BOT] Commit & Deploy from Notion"
          branch: main
          commit_user_name: morimin-bot 🤖
          commit_user_email: morimin@github.com
          commit_author: morimin-bot 🤖 <morimin@github.com>
